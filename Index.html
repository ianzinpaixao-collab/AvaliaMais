<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvaliaMais</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F5F7]">
<!-- TOPO -->
<nav class="bg-black text-white p-4 flex justify-between">
<b>avaliaMais</b>
<div class="flex gap-3 text-sm"><button onclick="showPage('home')">Início</button><button onclick="showPage('admin')">Admin</button></div>
</nav>

<div id="page-home" class="max-w-4xl mx-auto p-4">
<!-- CADASTRO NO TOPO -->
<div class="bg-white rounded-3xl p-6 shadow-sm">
<h2 class="text-2xl font-extrabold">Cadastrar Empresa</h2>
<input id="c-nome" placeholder="Nome da empresa" class="w-full border p-3 rounded-xl mt-3">
<input id="c-cnpj" placeholder="CNPJ" class="w-full border p-3 rounded-xl mt-2">
<input id="c-desc" placeholder="Descrição da empresa (ex: Loja de roupas femininas...)" class="w-full border p-3 rounded-xl mt-2">
<select id="c-cat" class="w-full border p-3 rounded-xl mt-2">
<option value="Beleza">💄 Beleza</option>
<option value="Maquiagem">💋 Maquiagem</option>
<option value="Estetica Automotiva">🚗 Estética Automotiva</option>
<option value="Loja">🛍️ Loja</option>
<option value="Servicos">🔧 Venda de Serviço</option>
<option value="Restaurante">🍔 Restaurante</option>
<option value="Saude">🏥 Saúde</option>
</select>
<input id="c-whats" placeholder="WhatsApp" class="w-full border p-3 rounded-xl mt-2">
<label class="font-bold text-sm mt-4 block">FOTOS DA EMPRESA:</label>
<input type="file" id="c-fotos" multiple accept="image/*" class="w-full border p-3 rounded-xl mt-1 bg-gray-50">
<div id="preview" class="flex gap-2 mt-2"></div>
<button onclick="cadastrar()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold mt-4">Cadastrar e Gerar QR</button>
</div>

<!-- CATEGORIAS EMBAIXO -->
<div class="mt-8">
<h3 class="font-extrabold text-xl">Categorias</h3>
<div class="flex gap-2 mt-3 overflow-auto pb-2">
<button onclick="filtrar('Todos')" class="px-4 py-2 bg-black text-white rounded-full text-sm font-bold">Todos</button>
<button onclick="filtrar('Beleza')" class="px-4 py-2 bg-white rounded-full text-sm font-bold">💄 Beleza</button>
<button onclick="filtrar('Maquiagem')" class="px-4 py-2 bg-white rounded-full text-sm font-bold">💋 Maquiagem</button>
<button onclick="filtrar('Estetica Automotiva')" class="px-4 py-2 bg-white rounded-full text-sm font-bold">🚗 Auto</button>
<button onclick="filtrar('Loja')" class="px-4 py-2 bg-white rounded-full text-sm font-bold">🛍️ Loja</button>
<button onclick="filtrar('Servicos')" class="px-4 py-2 bg-white rounded-full text-sm font-bold">🔧 Serviços</button>
</div>
<div id="lista" class="grid md:grid-cols-2 gap-3 mt-4"></div>
</div>
</div>

<!-- PAGINA DA EMPRESA - ONDE CAI QUANDO ESCANEIA O QR -->
<div id="page-emp" class="hidden max-w-2xl mx-auto p-4">
<div class="bg-white rounded-3xl overflow-hidden shadow-sm">
<div id="emp-capa" class="h-64 bg-gray-200 bg-cover bg-center"></div>
<div class="p-6">
<h1 id="emp-nome" class="text-3xl font-extrabold"></h1>
<p id="emp-cat" class="text-sm text-white bg-black inline-block px-3 py-1 rounded-full mt-2"></p>
<p id="emp-desc" class="mt-4 text-gray-700"></p>
<div id="emp-fotos" class="grid grid-cols-3 gap-2 mt-4"></div>
<div id="emp-nota" class="mt-4 font-bold"></div>
<textarea id="emp-com" placeholder="Deixe sua avaliação..." class="w-full border p-3 rounded-xl mt-4"></textarea>
<button onclick="avaliar()" class="w-full bg-black text-white py-3 rounded-xl font-bold mt-2">Enviar Avaliação</button>
<div id="emp-avs" class="mt-6"></div>
<button onclick="showPage('home')" class="w-full mt-6 bg-gray-100 py-3 rounded-xl font-bold">Voltar ao Início</button>
</div>
</div>
</div>

<!-- ADMIN -->
<div id="page-admin" class="hidden max-w-4xl mx-auto p-4">
<div class="bg-white rounded-3xl p-6"><h2 class="font-bold text-xl">Admin - Todos os CNPJs</h2><div id="admin-lista" class="mt-4"></div><button onclick="showPage('home')" class="mt-4 bg-black text-white px-4 py-2 rounded-full">Voltar</button></div>
</div>

<!-- MODAL QR -->
<div id="modal-qr" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-3xl p-6 text-center max-w-sm w-full">
<h3 class="font-bold text-lg">QR Code Gerado!</h3><p id="qr-nome" class="text-sm text-gray-500"></p>
<div id="qrcode" class="flex justify-center p-4 mt-3 border rounded-2xl"></div>
<p class="text-xs text-gray-500 mt-3">Quando o cliente escanear, vai DIRETO para a página da empresa com fotos e descrição. Não vai mais para o cadastro.</p>
<button onclick="document.getElementById('modal-qr').classList.add('hidden')" class="w-full bg-black text-white py-3 rounded-xl mt-4 font-bold">Fechar</button>
</div>
</div>

<script>
let empresas = JSON.parse(localStorage.getItem('am_final')||'[]');
let fotosTemp=[], filtro='Todos', ativa=null, nota=5;
const $=id=>document.getElementById(id);
$('c-fotos').addEventListener('change',e=>{
 fotosTemp=[]; $('preview').innerHTML='';
 [...e.target.files].slice(0,3).forEach(f=>{
  const r=new FileReader(); r.onload=ev=>{ fotosTemp.push(ev.target.result); $('preview').innerHTML+=`<img src="${ev.target.result}" class="w-16 h-16 rounded-xl object-cover">`; }; r.readAsDataURL(f);
 });
});
function save(){localStorage.setItem('am_final',JSON.stringify(empresas));}
function showPage(p){
 document.getElementById('page-home').classList.add('hidden');
 document.getElementById('page-emp').classList.add('hidden');
 document.getElementById('page-admin').classList.add('hidden');
 document.getElementById('page-'+p).classList.remove('hidden');
 if(p=='home') render(); if(p=='admin') renderAdmin();
}
function cadastrar(){
 const nome=$('c-nome').value, cnpj=$('c-cnpj').value, desc=$('c-desc').value, cat=$('c-cat').value, whats=$('c-whats').value;
 if(!nome||!cnpj) return alert('Preencha nome e CNPJ');
 const id=Date.now().toString();
 empresas.push({id,nome,cnpj,desc,cat,whats,fotos:fotosTemp,avs:[],media:5});
 save(); $('c-fotos').value=''; $('preview').innerHTML=''; openQR(id); render();
}
function openQR(id){
 const emp=empresas.find(x=>x.id==id); ativa=emp; $('qr-nome').innerText=emp.nome; $('qrcode').innerHTML='';
 const link = location.origin + location.pathname + '?empresa=' + emp.id;
 new QRCode($('qrcode'),{text:link,width:200,height:200});
 $('modal-qr').classList.remove('hidden');
}
function openEmp(id){
 const emp=empresas.find(x=>x.id==id); if(!emp) return; ativa=emp;
 $('emp-nome').innerText=emp.nome; $('emp-cat').innerText=emp.cat; $('emp-desc').innerText=emp.desc||'Sem descrição';
 $('emp-capa').style.backgroundImage=emp.fotos[0]?`url(${emp.fotos[0]})`:'';
 $('emp-fotos').innerHTML=emp.fotos.map(f=>`<img src="${f}" class="w-full h-24 object-cover rounded-xl">`).join('');
 $('emp-nota').innerText=`★ ${emp.media.toFixed(1)} - ${emp.avs.length} avaliações`;
 $('emp-avs').innerHTML=emp.avs.map(a=>`<div class="bg-gray-50 p-3 rounded-xl mt-2"><b>★ ${a.nota}</b><p>${a.texto}</p></div>`).join('');
 showPage('emp'); history.replaceState(null,'','?empresa='+id);
}
function filtrar(cat){ filtro=cat; render(); }
function render(){
 const lista = filtro=='Todos'? empresas : empresas.filter(e=>e.cat==filtro);
 $('lista').innerHTML=lista.map(e=>`
 <div class="bg-white p-4 rounded-2xl shadow-sm">
  <div class="h-32 bg-gray-100 rounded-xl bg-cover bg-center" style="background-image:url(${e.fotos[0]||''})"></div>
  <div class="flex justify-between mt-2"><b>${e.nome}</b><span class="text-xs bg-black text-white px-2 py-1 rounded-full">${e.cat}</span></div>
  <p class="text-xs text-gray-500 line-clamp-2 mt-1">${e.desc||''}</p>
  <p class="text-xs mt-1">★ ${e.media.toFixed(1)} (${e.avs.length})</p>
  <div class="flex gap-2 mt-3"><button onclick="openQR('${e.id}')" class="flex-1 bg-blue-100 text-blue-600 py-2 rounded-full font-bold text-xs">Ver QR</button><button onclick="openEmp('${e.id}')" class="flex-1 bg-black text-white py-2 rounded-full font-bold text-xs">Ver Página</button></div>
 </div>`).join('') || '<p class="text-gray-400">Nenhuma empresa nessa categoria ainda</p>';
}
function avaliar(){
 const t=$('emp-com').value; if(!t) return alert('Escreva algo');
 ativa.avs.push({nota:5,texto:t}); ativa.media=ativa.avs.length?5:5; save(); $('emp-com').value=''; openEmp(ativa.id);
}
function renderAdmin(){
 $('admin-lista').innerHTML=empresas.map(e=>`<div class="border p-3 rounded-xl text-sm flex justify-between"><div><b>${e.nome}</b> - ${e.cnpj} | ${e.cat}<br>${e.whats} - ${e.desc}</div><button onclick="openQR('${e.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-full">QR</button></div>`).join('');
}
window.onload=()=>{
 render();
 const id = new URLSearchParams(location.search).get('empresa');
 if(id) setTimeout(()=>openEmp(id),500);
}
</script>
</body>
</html>
