<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvaliaMais</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7]">
<nav class="bg-black text-white p-4 flex justify-between items-center">
<div onclick="location.href=location.pathname" class="font-extrabold text-xl cursor-pointer">avalia<span class="text-blue-400">Mais</span></div>
<div class="flex gap-2">
<button onclick="irParaEmpresas()" class="bg-white/20 px-4 py-2 rounded-full text-sm font-bold">Empresas</button>
<button onclick="abrirAdmin()" class="bg-blue-600 px-4 py-2 rounded-full text-sm font-bold">🔒 Admin</button>
</div>
</nav>

<div id="tela-publica" class="max-w-5xl mx-auto p-4">
<div class="bg-black text-white rounded-3xl p-6 mt-4">
<h1 class="text-2xl font-extrabold">Empresas da sua cidade</h1>
<p class="text-white/60 text-sm mt-1">Escaneie o QR na loja e avalie</p>
</div>
<div id="lista-empresas" class="grid md:grid-cols-3 gap-3 mt-6"></div>
</div>

<div id="tela-empresa" class="hidden max-w-2xl mx-auto p-4">
<div class="bg-white rounded-3xl overflow-hidden">
<div id="e-foto" class="h-72 bg-gray-200 bg-cover bg-center"></div>
<div class="p-6">
<h1 id="e-nome" class="text-3xl font-extrabold"></h1>
<p id="e-cat" class="bg-black text-white inline-block px-3 py-1 rounded-full text-xs mt-2"></p>
<p id="e-desc" class="text-gray-600 mt-3"></p>
<p id="e-tel" class="text-sm mt-2 font-bold"></p>
<div id="e-fotos" class="grid grid-cols-3 gap-2 mt-4"></div>
<textarea id="e-com" placeholder="Deixe sua avaliação..." class="w-full border p-3 rounded-xl mt-6"></textarea>
<button onclick="avaliar()" class="w-full bg-black text-white py-3 rounded-xl font-bold mt-2">Enviar Avaliação</button>
<button onclick="irParaEmpresas()" class="w-full bg-gray-100 py-3 rounded-xl font-bold mt-3">Voltar</button>
</div>
</div>
</div>

<div id="tela-admin" class="hidden max-w-3xl mx-auto p-4">
<div class="bg-white rounded-3xl p-6 mt-4">
<h2 class="text-xl font-extrabold">🔒 Só você cadastra aqui</h2>
<p class="text-sm text-gray-500">Quem escaneia o QR nunca vê essa tela</p>
<input id="c-nome" placeholder="Nome da empresa" class="w-full border p-3 rounded-xl mt-4">
<input id="c-cnpj" placeholder="CNPJ" class="w-full border p-3 rounded-xl mt-2">
<select id="c-cat" class="w-full border p-3 rounded-xl mt-2">
<option>💄 Beleza</option><option>💋 Maquiagem</option><option>🚗 Estética Automotiva</option><option>🛍️ Loja</option><option>🔧 Serviços</option><option>🍔 Culinária</option>
</select>
<input id="c-desc" placeholder="Descrição da empresa" class="w-full border p-3 rounded-xl mt-2">
<input id="c-tel" placeholder="Telefone / WhatsApp" class="w-full border p-3 rounded-xl mt-2">
<input id="c-fotos" type="file" multiple accept="image/*" class="w-full border p-3 rounded-xl mt-2 bg-gray-50">
<div id="preview" class="flex gap-2 mt-2"></div>
<button onclick="cadastrar()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mt-3">Cadastrar e Gerar QR</button>
<div id="admin-lista" class="mt-6 space-y-2"></div>
<button onclick="irParaEmpresas()" class="mt-4 bg-black text-white px-4 py-2 rounded-full text-sm">Ver site público</button>
</div>
</div>

<div id="modal-senha" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
<div class="bg-white p-6 rounded-3xl w-full max-w-sm text-center">
<h3 class="font-bold">Senha do dono</h3>
<input id="senha" type="password" placeholder="admin123" class="w-full border p-3 rounded-xl mt-3 text-center">
<button onclick="verificarSenha()" class="w-full bg-black text-white py-3 rounded-xl mt-3 font-bold">Entrar</button>
<button onclick="document.getElementById('modal-senha').classList.add('hidden')" class="w-full bg-gray-100 py-3 rounded-xl mt-2">Cancelar</button>
</div>
</div>

<div id="modal-qr" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
<div class="bg-white p-6 rounded-3xl w-full max-w-sm text-center">
<h3 class="font-bold">QR Code</h3>
<p id="qr-nome" class="text-sm text-gray-500"></p>
<div id="qrcode" class="flex justify-center mt-3 border p-3 rounded-2xl"></div>
<p class="text-xs text-green-600 font-bold mt-2">Funciona em qualquer celular</p>
<button onclick="document.getElementById('modal-qr').classList.add('hidden')" class="w-full bg-black text-white py-3 rounded-xl mt-3 font-bold">Fechar</button>
</div>
</div>

<script>
let empresas = JSON.parse(localStorage.getItem('am_v3')||'[]');
let fotosTemp=[];
let ativa=null;
function $(id){return document.getElementById(id);}
$('c-fotos').addEventListener('change', e=>{
 fotosTemp=[]; $('preview').innerHTML='';
 [...e.target.files].slice(0,3).forEach(file=>{
  let r=new FileReader(); r.onload=ev=>{ fotosTemp.push(ev.target.result); $('preview').innerHTML+=`<img src="${ev.target.result}" class="w-16 h-16 rounded-xl object-cover">`; }; r.readAsDataURL(file);
 });
});
function save(){localStorage.setItem('am_v3', JSON.stringify(empresas));}
function abrirAdmin(){ $('modal-senha').classList.remove('hidden'); }
function verificarSenha(){ if($('senha').value==='admin123'){ $('modal-senha').classList.add('hidden'); $('senha').value=''; $('tela-publica').classList.add('hidden'); $('tela-empresa').classList.add('hidden'); $('tela-admin').classList.remove('hidden'); renderAdmin(); } else alert('Senha errada! Use admin123'); }
function irParaEmpresas(){ $('tela-publica').classList.remove('hidden'); $('tela-empresa').classList.add('hidden'); $('tela-admin').classList.add('hidden'); history.replaceState(null,'',location.pathname); renderPublica(); }
function cadastrar(){ let nome=$('c-nome').value, cnpj=$('c-cnpj').value, cat=$('c-cat').value, desc=$('c-desc').value, tel=$('c-tel').value; if(!nome) return alert('Nome obrigatório'); let emp={id:Date.now().toString(), nome,cnpj,cat,desc,tel,fotos:fotosTemp, avs:[]}; empresas.push(emp); save(); $('c-nome').value=''; $('c-cnpj').value=''; $('c-desc').value=''; $('c-tel').value=''; $('preview').innerHTML=''; fotosTemp=[]; abrirQR(emp); renderAdmin(); }
function abrirQR(emp){ $('qr-nome').innerText=emp.nome; $('qrcode').innerHTML=''; let dados=btoa(encodeURIComponent(JSON.stringify(emp))); let link=location.origin+location.pathname+'?d='+dados; new QRCode($('qrcode'),{text:link,width:200,height:200}); $('modal-qr').classList.remove('hidden'); }
function renderPublica(){ $('lista-empresas').innerHTML=empresas.map(e=>`<div class="bg-white p-4 rounded-2xl"><div class="h-32 bg-gray-100 rounded-xl bg-cover bg-center" style="background-image:url(${e.fotos[0]||''})"></div><b class="mt-2 block">${e.nome}</b><span class="text-xs bg-black text-white px-2 py-1 rounded-full">${e.cat}</span><p class="text-xs text-gray-500 mt-1">${e.desc||''}</p><button onclick="verEmpresa('${e.id}')" class="w-full mt-3 bg-black text-white py-2 rounded-full text-sm font-bold">Ver e Avaliar</button></div>`).join('')||'<p class="text-center text-gray-400 py-10">Nenhuma empresa ainda. Clique em Admin.</p>'; }
function verEmpresa(id){ let emp=empresas.find(x=>x.id===id); if(!emp) return; mostrarEmpresa(emp); }
function mostrarEmpresa(emp){ ativa=emp; $('e-nome').innerText=emp.nome; $('e-cat').innerText=emp.cat; $('e-desc').innerText=emp.desc||''; $('e-tel').innerText=emp.tel||''; $('e-foto').style.backgroundImage=emp.fotos[0]?`url(${emp.fotos[0]})`:''; $('e-fotos').innerHTML=emp.fotos.map(f=>`<img src="${f}" class="w-full h-24 object-cover rounded-xl">`).join(''); $('tela-publica').classList.add('hidden'); $('tela-admin').classList.add('hidden'); $('tela-empresa').classList.remove('hidden'); }
function renderAdmin(){ $('admin-lista').innerHTML=empresas.map(e=>`<div class="border p-3 rounded-xl flex justify-between items-center"><div><b>${e.nome}</b><br><span class="text-xs">${e.cnpj} - ${e.cat}</span></div><button onclick="abrirQRById('${e.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-full text-sm">QR</button></div>`).join(''); }
function abrirQRById(id){ let emp=empresas.find(x=>x.id===id); abrirQR(emp); }
function avaliar(){ let t=$('e-com').value; if(!t) return alert('Escreva algo'); alert('Avaliação enviada! Obrigado'); $('e-com').value=''; }
window.onload=()=>{ let p=new URLSearchParams(location.search).get('d'); if(p){ try{ let emp=JSON.parse(decodeURIComponent(atob(p))); mostrarEmpresa(emp); return; }catch(e){} } renderPublica(); }
</script>
</body>
</html>
