<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvaliaMais - Oficial</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap');
body{font-family:'Outfit',sans-serif;background:#f6f5fa}
</style>
</head>
<body>
<nav class="bg-[#0f0f1a] text-white px-4 py-4 flex justify-between items-center sticky top-0 z-50">
<div onclick="showPage('home')" class="cursor-pointer font-extrabold text-xl">avalia<span class="text-blue-400">Mais</span></div>
<div class="flex gap-3 text-sm font-bold"><button onclick="showPage('arena')">Arena</button><button onclick="showPage('admin')" class="text-blue-400">Admin</button></div>
</nav>
<div id="app" class="max-w-4xl mx-auto p-4">
<div id="page-home">
<div class="bg-white rounded-[24px] p-8 mt-6 shadow-sm">
<h1 class="text-3xl font-extrabold">Cadastro da Empresa</h1>
<input id="c-nome" placeholder="Nome da empresa" class="w-full mt-4 border p-3 rounded-xl">
<input id="c-cnpj" placeholder="CNPJ: 00.000.000/0000-00" class="w-full mt-3 border p-3 rounded-xl">
<input id="c-whats" placeholder="WhatsApp" class="w-full mt-3 border p-3 rounded-xl">
<input id="c-email" placeholder="E-mail" class="w-full mt-3 border p-3 rounded-xl">
<label class="block mt-4 font-bold text-sm">FOTOS DA EMPRESA (mostra para quem escanear):</label>
<input type="file" id="c-fotos" multiple accept="image/*" class="w-full mt-2 border p-3 rounded-xl bg-gray-50">
<div id="preview" class="flex gap-2 mt-3"></div>
<button onclick="cadastrar()" class="w-full mt-5 bg-blue-600 text-white py-4 rounded-xl font-bold">Cadastrar e Gerar QR Code</button>
</div>
<div id="lista-home" class="mt-6 grid gap-3"></div>
</div>
<div id="page-empresa" class="hidden">
<div class="bg-white rounded-[24px] overflow-hidden shadow-sm mt-4">
<div id="e-capa" class="h-64 bg-gray-200 bg-cover bg-center"></div>
<div class="p-6">
<h2 id="e-nome" class="text-2xl font-extrabold"></h2>
<p id="e-info" class="text-gray-500 text-sm"></p>
<div id="e-media" class="mt-2 inline-block bg-yellow-400 px-3 py-1 rounded-full font-bold"></div>
<div id="e-fotos" class="grid grid-cols-3 gap-2 mt-5"></div>
<h3 class="font-bold mt-6">Deixe sua avaliação</h3>
<div id="stars" class="flex gap-1 text-3xl my-2"><span onclick="setStar(1)">★</span><span onclick="setStar(2)">★</span><span onclick="setStar(3)">★</span><span onclick="setStar(4)">★</span><span onclick="setStar(5)">★</span></div>
<textarea id="e-com" placeholder="Como foi lá?" class="w-full border p-3 rounded-xl"></textarea>
<button onclick="avaliar()" class="w-full mt-3 bg-black text-white py-3 rounded-xl font-bold">Enviar Avaliação</button>
<div id="e-lista-av" class="mt-6 space-y-2"></div>
</div>
</div>
</div>
<div id="page-arena" class="hidden"><h2 class="text-2xl font-extrabold mt-4">Arena</h2><div id="lista-arena" class="mt-4 grid gap-3"></div></div>
<div id="page-admin" class="hidden">
<div class="bg-white rounded-[24px] p-6 mt-4 shadow-sm">
<h2 class="text-xl font-bold">🔒 Painel Admin - Controle Total</h2>
<p id="admin-stats" class="text-sm text-gray-600 mt-1"></p>
<div class="flex gap-2 mt-4"><button onclick="exportar()" class="bg-green-500 text-white px-4 py-2 rounded-full font-bold text-sm">Exportar para Excel (CSV)</button><button onclick="limpar()" class="bg-red-500 text-white px-4 py-2 rounded-full font-bold text-sm">Limpar Tudo</button><button onclick="showPage('home')" class="bg-black text-white px-4 py-2 rounded-full font-bold text-sm">Voltar ao Site</button></div>
<div id="lista-admin" class="mt-6 space-y-2"></div>
</div>
</div>
</div>
<div id="modal-qr" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[99]">
<div class="bg-white rounded-[24px] p-6 w-full max-w-sm text-center">
<h3 class="font-extrabold text-lg">QR Code da Empresa</h3>
<p id="qr-nome" class="text-sm text-gray-500 mb-3"></p>
<div id="qrcode" class="flex justify-center p-4 border rounded-2xl"></div>
<p class="text-xs text-gray-400 mt-3">Ao escanear, o cliente cai DIRETO na página da empresa com fotos.</p>
<button onclick="document.getElementById('modal-qr').classList.add('hidden')" class="w-full mt-4 bg-black text-white py-3 rounded-xl font-bold">Fechar</button>
</div>
</div>
<script>
let empresas = JSON.parse(localStorage.getItem('am_v4')||'[]');
let fotosTemp=[]; let nota=5; let ativa=null;
const $ = id=>document.getElementById(id);
$('c-fotos').addEventListener('change', e=>{
 fotosTemp=[]; $('preview').innerHTML='';
 [...e.target.files].slice(0,3).forEach(file=>{
  const r=new FileReader(); r.onload=ev=>{ fotosTemp.push(ev.target.result); $('preview').innerHTML+=`<img src="${ev.target.result}" class="w-20 h-20 rounded-xl object-cover">`; }; r.readAsDataURL(file);
 });
});
function save(){ localStorage.setItem('am_v4', JSON.stringify(empresas)); }
function showPage(p){ document.querySelectorAll('[id^="page-"]').forEach(d=>d.classList.add('hidden')); $('page-'+p).classList.remove('hidden'); if(p==='home')renderHome(); if(p==='arena')renderArena(); if(p==='admin')renderAdmin(); }
function cadastrar(){
 const nome=$('c-nome').value, cnpj=$('c-cnpj').value, whats=$('c-whats').value, email=$('c-email').value;
 if(!nome||!cnpj) return alert('Preencha nome e CNPJ');
 const id=Date.now().toString();
 empresas.push({id,nome,cnpj,whats,email,fotos:fotosTemp,avaliacoes:[],media:5});
 save(); fotosTemp=[]; $('c-fotos').value=''; $('preview').innerHTML='';
 openQR(id); renderHome();
}
function openQR(id){
 const emp=empresas.find(x=>x.id===id); if(!emp)return; ativa=emp;
 $('qr-nome').innerText=emp.nome; $('qrcode').innerHTML='';
 const link = location.origin + location.pathname + '?empresa=' + emp.id;
 new QRCode($('qrcode'), {text:link, width:220, height:220});
 $('modal-qr').classList.remove('hidden');
}
function openEmpresa(id){
 const emp=empresas.find(x=>x.id===id); if(!emp)return; ativa=emp;
 $('e-nome').innerText=emp.nome; $('e-info').innerText=emp.cnpj+' | '+emp.whats; $('e-media').innerText='★ '+(emp.media||5).toFixed(1)+' | '+emp.avaliacoes.length+' avaliações';
 $('e-capa').style.backgroundImage=emp.fotos[0]?`url(${emp.fotos[0]})`:'none';
 $('e-fotos').innerHTML=emp.fotos.map(f=>`<img src="${f}" class="w-full h-24 object-cover rounded-xl">`).join('') || '<p class="text-xs text-gray-400">Sem fotos</p>';
 $('e-lista-av').innerHTML=emp.avaliacoes.map(a=>`<div class="bg-gray-50 p-3 rounded-xl"><b>${'★'.repeat(a.nota)}</b><p class="text-sm">${a.texto}</p></div>`).join('') || '<p class="text-sm text-gray-400">Nenhuma avaliação ainda</p>';
 showPage('empresa'); history.replaceState(null,'','?empresa='+emp.id);
}
function setStar(n){ nota=n; document.querySelectorAll('#stars span').forEach((s,i)=>s.style.opacity=i<n?'1':'0.2'); }
function avaliar(){
 const t=$('e-com').value; if(!t) return alert('Escreva algo');
 ativa.avaliacoes.push({nota,texto:t}); ativa.media=ativa.avaliacoes.reduce((a,b)=>a+b.nota,0)/ativa.avaliacoes.length;
 save(); $('e-com').value=''; openEmpresa(ativa.id);
}
function renderHome(){
 $('lista-home').innerHTML=empresas.map(e=>`<div class="bg-white p-4 rounded-2xl shadow-sm"><div class="h-32 bg-gray-100 rounded-xl bg-cover bg-center" style="background-image:url(${e.fotos[0]||''})"></div><b>${e.nome}</b><p class="text-xs text-gray-500">Média: ${e.media.toFixed(1)} ★ | ${e.avaliacoes.length} avaliações</p><div class="flex gap-2 mt-2"><button onclick="openQR('${e.id}')" class="flex-1 bg-blue-100 text-blue-600 py-2 rounded-full font-bold text-sm">Ver QR</button><button onclick="openEmpresa('${e.id}')" class="flex-1 bg-black text-white py-2 rounded-full font-bold text-sm">Ver página</button></div></div>`).join('');
}
function renderArena(){
 const ord=[...empresas].sort((a,b)=>b.media-a.media);
 $('lista-arena').innerHTML=ord.map((e,i)=>`<div class="bg-white p-4 rounded-2xl flex gap-3 items-center"><b>#${i+1}</b><div class="w-12 h-12 bg-gray-100 rounded-xl bg-cover" style="background-image:url(${e.fotos[0]||''})"></div><div class="flex-1"><b>${e.nome}</b><p class="text-xs">${e.avaliacoes.length} avaliações</p></div><div class="bg-yellow-400 px-3 py-1 rounded-full font-bold">★ ${e.media.toFixed(1)}</div></div>`).join('');
}
function renderAdmin(){
 $('admin-stats').innerText=`Total: ${empresas.length} empresas | ${empresas.reduce((a,b)=>a+b.avaliacoes.length,0)} avaliações`;
 $('lista-admin').innerHTML=empresas.map(e=>`<div class="border rounded-xl p-3 flex justify-between items-center"><div class="text-sm"><b>${e.nome}</b> - ${e.cnpj}<br>${e.email} | ${e.whats} | Média: ${e.media.toFixed(1)} ★ | Total: ${e.avaliacoes.length} avaliações</div><button onclick="openQR('${e.id}')" class="bg-blue-600 text-white px-3 py-1 rounded-full text-sm font-bold">Ver QR</button></div>`).join('');
}
function exportar(){
 let csv='Nome,CNPJ,WhatsApp,Email,Media,Total\n'; empresas.forEach(e=>{ csv+=`"${e.nome}","${e.cnpj}","${e.whats}","${e.email}",${e.media},${e.avaliacoes.length}\n`; });
 const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='avaliamais.csv'; a.click();
}
function limpar(){ if(confirm('Apagar tudo?')){ empresas=[]; save(); renderHome(); renderAdmin(); } }
window.onload=()=>{ renderHome(); const p=new URLSearchParams(location.search).get('empresa'); if(p){ setTimeout(()=>openEmpresa(p),400); } setStar(5); };
</script>
</body>
</html>
