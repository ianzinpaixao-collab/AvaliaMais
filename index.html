<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AvaliaMais - Sistema Oficial</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
body{font-family:'Outfit',sans-serif;background:#F6F5FA}
.hidden{display:none!important}
</style>
</head>
<body>
<nav class="bg-[#0F0F1A] text-white px-5 py-4 flex justify-between items-center sticky top-0 z-50">
<div onclick="goHomePublic()" class="font-extrabold text-xl cursor-pointer">avalia<span class="text-blue-400">Mais</span></div>
<div class="flex gap-2">
<button onclick="goHomePublic()" class="bg-white/10 px-4 py-2 rounded-full text-sm font-bold">Empresas</button>
<button onclick="askAdmin()" class="bg-blue-600 px-4 py-2 rounded-full text-sm font-bold">🔒 Admin</button>
</div>
</nav>

<div id="page-public" class="max-w-6xl mx-auto p-4">
<div class="bg-gradient-to-br from-black to-zinc-800 rounded-[28px] p-7 text-white mt-4">
<h1 class="text-3xl font-extrabold leading-tight">Descubra as melhores<br>empresas da sua cidade</h1>
<p class="text-white/60 text-sm mt-2">Escaneie o QR na loja e avalie. Ranking atualizado semanal e mensal.</p>
</div>
<div class="flex gap-2 mt-6 overflow-x-auto pb-2">
<button onclick="filtrarCat('Todos')" id="cat-Todos" class="cat-btn bg-black text-white px-5 py-2.5 rounded-full text-sm font-bold">Todos</button>
<button onclick="filtrarCat('Beleza')" id="cat-Beleza" class="cat-btn bg-white px-5 py-2.5 rounded-full text-sm font-bold">💄 Beleza</button>
<button onclick="filtrarCat('Maquiagem')" id="cat-Maquiagem" class="cat-btn bg-white px-5 py-2.5 rounded-full text-sm font-bold">💋 Maquiagem</button>
<button onclick="filtrarCat('Estética Automotiva')" id="cat-Estética Automotiva" class="cat-btn bg-white px-5 py-2.5 rounded-full text-sm font-bold">🚗 Auto</button>
<button onclick="filtrarCat('Loja')" id="cat-Loja" class="cat-btn bg-white px-5 py-2.5 rounded-full text-sm font-bold">🛍️ Loja</button>
<button onclick="filtrarCat('Serviços')" id="cat-Serviços" class="cat-btn bg-white px-5 py-2.5 rounded-full text-sm font-bold">🔧 Serviços</button>
<button onclick="filtrarCat('Culinária')" id="cat-Culinária" class="cat-btn bg-white px-5 py-2.5 rounded-full text-sm font-bold">🍔 Culinária</button>
</div>
<div class="grid md:grid-cols-2 gap-4 mt-6">
<div class="bg-white rounded-[24px] p-5"><h3 class="font-extrabold">🏆 Ranking da Semana</h3><div id="ranking-semana" class="mt-3 space-y-2"></div></div>
<div class="bg-white rounded-[24px] p-5"><h3 class="font-extrabold">🔥 Ranking do Mês</h3><div id="ranking-mes" class="mt-3 space-y-2"></div></div>
</div>
<div id="lista-public" class="grid md:grid-cols-3 gap-3 mt-6"></div>
</div>

<div id="page-empresa" class="hidden max-w-2xl mx-auto p-4">
<div class="bg-white rounded-[28px] overflow-hidden shadow-sm">
<div id="e-capa" class="h-[320px] bg-gray-200 bg-cover bg-center"></div>
<div class="p-6">
<div class="flex justify-between items-start">
<div><h1 id="e-nome" class="text-3xl font-extrabold"></h1><p id="e-cat" class="bg-black text-white inline-block px-3 py-1 rounded-full text-xs font-bold mt-2"></p></div>
<div id="e-media-box" class="bg-yellow-400 px-4 py-2 rounded-2xl font-extrabold text-center"></div>
</div>
<p id="e-desc" class="text-gray-600 mt-4 leading-relaxed"></p>
<div class="flex gap-2 mt-3 text-xs text-gray-500"><span id="e-tel"></span
